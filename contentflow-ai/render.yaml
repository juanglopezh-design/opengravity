services:
  - type: web
    name: contentflow-ai
    runtime: node
    plan: free
    rootDir: contentflow-ai
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://contentflow-ai-9wy7.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://contentflow-ai-9wy7.onrender.com